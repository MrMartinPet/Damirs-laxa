<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viljas Sverige Flashcards</title>

  <style>
    :root{
      --bg:#eef4f8;
      --card:#ffffff;
      --text:#132033;
      --muted:#667085;
      --blue:#156082;
      --blueLight:#e7f3f7;
      --green:#21803f;
      --yellow:#f6c453;
      --border:#d9e2ea;
      --shadow:0 12px 28px rgba(20,32,51,.12);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:linear-gradient(180deg,#dff0f6 0%,var(--bg) 48%);
      color:var(--text);
    }

    .app{
      height:100dvh;
      max-width:520px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:10px;
    }

    header{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .badge{
      background:var(--blueLight);
      color:var(--blue);
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }

    .small{
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }

    h1{
      margin:0;
      font-size:27px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    h2{
      margin:0 0 8px;
      font-size:24px;
      letter-spacing:-.02em;
    }

    p{
      margin:6px 0;
      line-height:1.35;
    }

    .screen{
      display:none;
      flex:1 1 auto;
      min-height:0;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .screen.active{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menuGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      overflow:hidden;
    }

    button{
      border:0;
      border-radius:18px;
      padding:13px 14px;
      font-size:15px;
      font-weight:850;
      background:var(--blue);
      color:white;
      cursor:pointer;
      min-height:48px;
    }

    button.secondary{
      background:#eef2f6;
      color:var(--text);
      border:1px solid var(--border);
    }

    button.green{
      background:var(--green);
    }

    button.yellow{
      background:var(--yellow);
      color:#302400;
    }

    .menuBtn{
      min-height:84px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      text-align:left;
      gap:5px;
    }

    .menuBtn span{
      font-size:12px;
      font-weight:650;
      opacity:.88;
    }

    .navRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:auto;
      flex:0 0 auto;
    }

    .counter{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      font-weight:850;
      flex:0 0 auto;
    }

    .flashWrap{
      perspective:1000px;
      flex:1 1 auto;
      min-height:260px;
      display:flex;
    }

    .flashCard{
      width:100%;
      position:relative;
      transform-style:preserve-3d;
      transition:transform .55s cubic-bezier(.2,.8,.2,1);
      cursor:pointer;
      min-height:260px;
    }

    .flashCard.flipped{
      transform:rotateY(180deg);
    }

    .face{
      position:absolute;
      inset:0;
      border-radius:26px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backface-visibility:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:22px;
      overflow:hidden;
    }

    .front{
      background:linear-gradient(180deg,#ffffff,#f7fafc);
    }

    .back{
      background:linear-gradient(180deg,var(--blueLight),#ffffff);
      transform:rotateY(180deg);
    }

    .faceLabel{
      position:absolute;
      top:14px;
      left:14px;
      font-size:12px;
      font-weight:950;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .categoryLabel{
      position:absolute;
      top:14px;
      right:14px;
      font-size:12px;
      font-weight:900;
      background:#eef2f6;
      color:var(--text);
      border-radius:999px;
      padding:5px 8px;
      max-width:48%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .faceText{
      font-size:25px;
      font-weight:950;
      line-height:1.14;
      letter-spacing:-.03em;
      max-width:100%;
    }

    .back .faceText{
      font-size:20px;
      font-weight:850;
    }

    .tapHint{
      position:absolute;
      bottom:14px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
    }

    .progressWrap{
      height:10px;
      background:#e6edf3;
      border-radius:999px;
      overflow:hidden;
      flex:0 0 auto;
    }

    .progress{
      height:100%;
      width:0%;
      background:var(--blue);
      transition:.25s;
    }

    @media(max-width:380px){
      .app{
        padding:10px;
      }

      h1{
        font-size:24px;
      }

      .menuBtn{
        min-height:74px;
      }

      .faceText{
        font-size:22px;
      }

      .back .faceText{
        font-size:18px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="topline">
        <div class="badge">Sverige flashcards</div>
        <div class="small" id="headerInfo">Start</div>
      </div>

      <h1>Viljas Sverigekort</h1>
      <p class="small">Tryck på kortet. Svara högt. Vänd och kontrollera.</p>
    </header>

    <main id="home" class="screen active">
      <h2>Välj kategori</h2>

      <div class="menuGrid">
        <button class="menuBtn" onclick="startCategory('landsdelar')">
          Landsdelar
          <span>Götaland, Svealand, Norrland</span>
        </button>

        <button class="menuBtn" onclick="startCategory('kartan')">
          Kartan
          <span>Norge, Finland, Kebnekaise</span>
        </button>

        <button class="menuBtn" onclick="startCategory('stader')">
          Städer i Norrland
          <span>9 städer</span>
        </button>

        <button class="menuBtn" onclick="startCategory('vatten')">
          Vatten
          <span>Hav, sjöar och bruk</span>
        </button>

        <button class="menuBtn" onclick="startCategory('berg')">
          Berg
          <span>Fjäll, malm och gruvdrift</span>
        </button>

        <button class="menuBtn" onclick="startCategory('manniskor')">
          Människor
          <span>Befolkning och ålder</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('begrepp')">
          Begrepp
          <span>Viktiga ord</span>
        </button>

        <button class="menuBtn yellow" onclick="startCategory('alla')">
          Alla kort
          <span>Allt blandat</span>
        </button>
      </div>
    </main>

    <section id="cards" class="screen">
      <h2 id="categoryTitle">Flashcards</h2>

      <div class="counter" id="counter">1 av 1</div>

      <div class="progressWrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="flashWrap">
        <div class="flashCard" id="flashCard" onclick="flipCard()">
          <div class="face front">
            <div class="faceLabel">Fråga</div>
            <div class="categoryLabel" id="frontCategory">Kategori</div>
            <div class="faceText" id="frontText"></div>
            <div class="tapHint">Tryck för att vända</div>
          </div>

          <div class="face back">
            <div class="faceLabel">Svar</div>
            <div class="categoryLabel" id="backCategory">Kategori</div>
            <div class="faceText" id="backText"></div>
            <div class="tapHint">Tryck för att vända tillbaka</div>
          </div>
        </div>
      </div>

      <div class="navRow">
        <button class="secondary" onclick="previousCard()">Föregående</button>
        <button onclick="nextCard()">Nästa kort</button>
      </div>

      <button class="secondary" onclick="openHome()">Till meny</button>
    </section>
  </div>

  <script>
    const categories = {
      landsdelar:{
        title:"Landsdelar",
        cards:[
          {
            q:"Vilka är Sveriges tre landsdelar?",
            a:"Götaland, Svealand och Norrland."
          },
          {
            q:"Vilken landsdel ligger längst söderut?",
            a:"Götaland."
          },
          {
            q:"Vilken landsdel ligger i mitten?",
            a:"Svealand."
          },
          {
            q:"Vilken landsdel ligger längst norrut?",
            a:"Norrland."
          }
        ]
      },

      kartan:{
        title:"Kartan",
        cards:[
          {
            q:"Var ligger Norge i relation till Sverige?",
            a:"Norge ligger väster om Sverige."
          },
          {
            q:"Var ligger Finland i relation till Sverige?",
            a:"Finland ligger öster och nordost om Sverige."
          },
          {
            q:"Vad heter Sveriges högsta berg?",
            a:"Kebnekaise."
          },
          {
            q:"Var ligger Kebnekaise ungefär?",
            a:"I norra Sverige, i Lappland."
          }
        ]
      },

      stader:{
        title:"Städer i Norrland",
        cards:[
          {
            q:"Nämn 9 städer i Norrland.",
            a:"Kiruna, Luleå, Umeå, Sundsvall, Östersund, Skellefteå, Örnsköldsvik, Gävle och Boden."
          },
          {
            q:"Nämn tre städer i Norrland.",
            a:"Till exempel Kiruna, Luleå och Umeå."
          },
          {
            q:"Nämn tre andra städer i Norrland.",
            a:"Till exempel Sundsvall, Östersund och Skellefteå."
          },
          {
            q:"Nämn tre till städer i Norrland.",
            a:"Till exempel Örnsköldsvik, Gävle och Boden."
          }
        ]
      },

      vatten:{
        title:"Vatten",
        cards:[
          {
            q:"Vilka hav och vatten omger Sverige?",
            a:"Bottenviken, Bottenhavet, Östersjön, Öresund, Kattegatt och Skagerack."
          },
          {
            q:"Vilka är Sveriges fyra största sjöar?",
            a:"Vänern, Vättern, Mälaren och Hjälmaren."
          },
          {
            q:"Vilka olika typer av vatten ska du kunna?",
            a:"Saltvatten, sötvatten och grundvatten."
          },
          {
            q:"Vad är saltvatten?",
            a:"Vatten med salt. Det finns i hav."
          },
          {
            q:"Vad är sötvatten?",
            a:"Vatten med lite eller inget salt. Det finns i sjöar och älvar."
          },
          {
            q:"Vad är grundvatten?",
            a:"Vatten som finns nere i marken."
          },
          {
            q:"Vad kan vi få från vatten?",
            a:"Dricksvatten, energi från vattenkraft och fisk."
          },
          {
            q:"Vad är vattenkraft?",
            a:"Energi eller el som skapas med hjälp av rinnande vatten."
          },
          {
            q:"Vad betyder överfiske?",
            a:"Att man fiskar så mycket att fisken riskerar att minska för mycket."
          },
          {
            q:"Förklara hållbart vattenbruk.",
            a:"Att använda vatten, fisk och andra vattenresurser utan att förstöra för framtiden."
          }
        ]
      },

      berg:{
        title:"Berg",
        cards:[
          {
            q:"Var finns det mycket berg i Sverige?",
            a:"I fjällen och i norra Sverige."
          },
          {
            q:"Vad är fjäll?",
            a:"Bergsområden, framför allt i norra Sverige."
          },
          {
            q:"Vad är malm?",
            a:"Berg eller sten som innehåller metall."
          },
          {
            q:"Vad är gruvdrift?",
            a:"När man bryter malm ur marken."
          },
          {
            q:"Vad kan vi få från berg?",
            a:"Malm och metaller genom gruvdrift."
          },
          {
            q:"Förklara hållbart bergsbruk.",
            a:"Att använda berg och malm utan att skada människor, natur och framtid mer än nödvändigt."
          }
        ]
      },

      manniskor:{
        title:"Människor",
        cards:[
          {
            q:"Ungefär hur många människor bor i Sverige?",
            a:"Ungefär 10 miljoner människor."
          },
          {
            q:"Var finns det flest människor i Sverige?",
            a:"I södra Sverige och i större tätorter."
          },
          {
            q:"Varför bor flest människor där?",
            a:"För att det finns fler jobb, skolor, service, vägar och städer där."
          },
          {
            q:"Vad betyder befolkning?",
            a:"Människorna som bor i ett land eller område."
          },
          {
            q:"Vad betyder befolkningstäthet?",
            a:"Hur många människor som bor på en viss yta."
          },
          {
            q:"Vad betyder landsbygd?",
            a:"Områden utanför städer och tätorter."
          },
          {
            q:"Vad betyder tätort?",
            a:"En plats där många hus och människor finns samlade."
          },
          {
            q:"Vad betyder urbanisering?",
            a:"Att fler människor flyttar till städer."
          },
          {
            q:"Vad betyder flyktingar?",
            a:"Människor som har tvingats lämna sitt hem eller land."
          },
          {
            q:"Vad betyder det att vi lever allt längre?",
            a:"Att människor i Sverige i genomsnitt blir äldre än tidigare."
          },
          {
            q:"Vilka konsekvenser kan det få att vi lever allt längre?",
            a:"Det blir fler äldre. Då behövs mer vård, omsorg och pengar till pensioner."
          }
        ]
      },

      begrepp:{
        title:"Begrepp",
        cards:[
          {
            q:"Energi",
            a:"Kraft som kan användas, till exempel el."
          },
          {
            q:"Dricksvatten",
            a:"Vatten som människor kan dricka."
          },
          {
            q:"Gruvdrift",
            a:"När man bryter malm ur marken."
          },
          {
            q:"Överfiske",
            a:"När man fiskar för mycket."
          },
          {
            q:"Saltvatten",
            a:"Vatten med salt."
          },
          {
            q:"Sötvatten",
            a:"Vatten med lite eller inget salt."
          },
          {
            q:"Vattenkraft",
            a:"Energi från rinnande vatten."
          },
          {
            q:"Grundvatten",
            a:"Vatten nere i marken."
          },
          {
            q:"Fjäll",
            a:"Bergsområden, framför allt i norra Sverige."
          },
          {
            q:"Malm",
            a:"Berg eller sten som innehåller metall."
          },
          {
            q:"Befolkning",
            a:"Människorna som bor i ett område."
          },
          {
            q:"Befolkningstäthet",
            a:"Hur tätt människor bor."
          },
          {
            q:"Landsbygd",
            a:"Områden utanför städer och tätorter."
          },
          {
            q:"Tätort",
            a:"Plats där många hus och människor finns samlade."
          },
          {
            q:"Urbanisering",
            a:"När fler människor flyttar till städer."
          },
          {
            q:"Flyktingar",
            a:"Människor som tvingats lämna sitt hem eller land."
          }
        ]
      }
    };

    let activeCards = [];
    let activeTitle = "";
    let currentIndex = 0;

    function openHome(){
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('home').classList.add('active');
      document.getElementById('headerInfo').textContent = 'Start';
    }

    function startCategory(key){
      if(key === 'alla'){
        activeCards = [];

        Object.keys(categories).forEach(categoryKey => {
          categories[categoryKey].cards.forEach(card => {
            activeCards.push({
              q:card.q,
              a:card.a,
              category:categories[categoryKey].title
            });
          });
        });

        activeTitle = "Alla kort";
      }else{
        activeCards = categories[key].cards.map(card => {
          return {
            q:card.q,
            a:card.a,
            category:categories[key].title
          };
        });

        activeTitle = categories[key].title;
      }

      currentIndex = 0;

      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('cards').classList.add('active');
      document.getElementById('headerInfo').textContent = activeTitle;
      document.getElementById('categoryTitle').textContent = activeTitle;

      renderCard();
    }

    function renderCard(){
      const card = activeCards[currentIndex];
      const progress = Math.round(((currentIndex + 1) / activeCards.length) * 100);

      document.getElementById('frontText').textContent = card.q;
      document.getElementById('backText').textContent = card.a;
      document.getElementById('frontCategory').textContent = card.category;
      document.getElementById('backCategory').textContent = card.category;
      document.getElementById('counter').textContent = (currentIndex + 1) + ' av ' + activeCards.length;
      document.getElementById('progress').style.width = progress + '%';
      document.getElementById('flashCard').classList.remove('flipped');
    }

    function flipCard(){
      document.getElementById('flashCard').classList.toggle('flipped');
    }

    function nextCard(){
      currentIndex = (currentIndex + 1) % activeCards.length;
      renderCard();
    }

    function previousCard(){
      currentIndex = (currentIndex - 1 + activeCards.length) % activeCards.length;
      renderCard();
    }
  </script>
</body>
</html>
