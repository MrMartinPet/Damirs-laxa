<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viljas Sverige Flashcards</title>

  <style>
    :root{
      --bg:#eef4f8;
      --card:#ffffff;
      --text:#132033;
      --muted:#667085;
      --blue:#156082;
      --blueLight:#e7f3f7;
      --green:#21803f;
      --yellow:#f6c453;
      --border:#d9e2ea;
      --shadow:0 12px 28px rgba(20,32,51,.12);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:linear-gradient(180deg,#dff0f6 0%,var(--bg) 48%);
      color:var(--text);
    }

    .app{
      height:100dvh;
      max-width:520px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:10px;
    }

    header{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .badge{
      background:var(--blueLight);
      color:var(--blue);
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }

    .small{
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }

    h1{
      margin:0;
      font-size:27px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    h2{
      margin:0 0 8px;
      font-size:24px;
      letter-spacing:-.02em;
    }

    p{
      margin:6px 0;
      line-height:1.35;
    }

    .screen{
      display:none;
      flex:1 1 auto;
      min-height:0;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .screen.active{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menuGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      overflow:auto;
      padding-bottom:2px;
    }

    button{
      border:0;
      border-radius:18px;
      padding:13px 14px;
      font-size:15px;
      font-weight:850;
      background:var(--blue);
      color:white;
      cursor:pointer;
      min-height:48px;
    }

    button.secondary{
      background:#eef2f6;
      color:var(--text);
      border:1px solid var(--border);
    }

    button.green{
      background:var(--green);
    }

    button.yellow{
      background:var(--yellow);
      color:#302400;
    }

    .menuBtn{
      min-height:84px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      text-align:left;
      gap:5px;
    }

    .menuBtn span{
      font-size:12px;
      font-weight:650;
      opacity:.88;
    }

    .navRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:auto;
      flex:0 0 auto;
    }

    .counter{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      font-weight:850;
      flex:0 0 auto;
    }

    .flashWrap{
      perspective:1000px;
      flex:1 1 auto;
      min-height:260px;
      display:flex;
    }

    .flashCard{
      width:100%;
      position:relative;
      transform-style:preserve-3d;
      transition:transform .55s cubic-bezier(.2,.8,.2,1);
      cursor:pointer;
      min-height:260px;
    }

    .flashCard.flipped{
      transform:rotateY(180deg);
    }

    .face{
      position:absolute;
      inset:0;
      border-radius:26px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backface-visibility:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:22px;
      overflow:hidden;
    }

    .front{
      background:linear-gradient(180deg,#ffffff,#f7fafc);
    }

    .back{
      background:linear-gradient(180deg,var(--blueLight),#ffffff);
      transform:rotateY(180deg);
    }

    .faceLabel{
      position:absolute;
      top:14px;
      left:14px;
      font-size:12px;
      font-weight:950;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .categoryLabel{
      position:absolute;
      top:14px;
      right:14px;
      font-size:12px;
      font-weight:900;
      background:#eef2f6;
      color:var(--text);
      border-radius:999px;
      padding:5px 8px;
      max-width:48%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .faceText{
      font-size:25px;
      font-weight:950;
      line-height:1.14;
      letter-spacing:-.03em;
      max-width:100%;
    }

    .back .faceText{
      font-size:19px;
      font-weight:850;
    }

    .tapHint{
      position:absolute;
      bottom:14px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
    }

    .progressWrap{
      height:10px;
      background:#e6edf3;
      border-radius:999px;
      overflow:hidden;
      flex:0 0 auto;
    }

    .progress{
      height:100%;
      width:0%;
      background:var(--blue);
      transition:.25s;
    }

    @media(max-width:380px){
      .app{
        padding:10px;
      }

      h1{
        font-size:24px;
      }

      .menuBtn{
        min-height:74px;
      }

      .faceText{
        font-size:22px;
      }

      .back .faceText{
        font-size:17px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="topline">
        <div class="badge">Sverige flashcards</div>
        <div class="small" id="headerInfo">Start</div>
      </div>

      <h1>Viljas Sverigekort</h1>
      <p class="small">Tryck på kortet. Svara högt. Vänd och kontrollera.</p>
    </header>

    <main id="home" class="screen active">
      <h2>Välj kategori</h2>

      <div class="menuGrid">
        <button class="menuBtn" onclick="startCategory('landsdelar')">
          Landsdelar
          <span>Götaland, Svealand, Norrland</span>
        </button>

        <button class="menuBtn" onclick="startCategory('kartan')">
          Kartan
          <span>Kebnekaise, Norge, Finland</span>
        </button>

        <button class="menuBtn" onclick="startCategory('stader')">
          Städer i Norrland
          <span>9 städer</span>
        </button>

        <button class="menuBtn" onclick="startCategory('havSjoar')">
          Hav och sjöar
          <span>Vatten runt Sverige</span>
        </button>

        <button class="menuBtn" onclick="startCategory('vatten')">
          Vatten
          <span>Var, varför och användning</span>
        </button>

        <button class="menuBtn" onclick="startCategory('berg')">
          Berg
          <span>Var, varför och användning</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('befolkning')">
          Befolkning
          <span>Antal, plats och ålder</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('begrepp')">
          Begrepp
          <span>Alla viktiga ord</span>
        </button>

        <button class="menuBtn yellow" onclick="startCategory('alla')">
          Alla kort
          <span>Allt från sida 1</span>
        </button>
      </div>
    </main>

    <section id="cards" class="screen">
      <h2 id="categoryTitle">Flashcards</h2>

      <div class="counter" id="counter">1 av 1</div>

      <div class="progressWrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="flashWrap">
        <div class="flashCard" id="flashCard" onclick="flipCard()">
          <div class="face front">
            <div class="faceLabel">Fråga</div>
            <div class="categoryLabel" id="frontCategory">Kategori</div>
            <div class="faceText" id="frontText"></div>
            <div class="tapHint">Tryck för att vända</div>
          </div>

          <div class="face back">
            <div class="faceLabel">Svar</div>
            <div class="categoryLabel" id="backCategory">Kategori</div>
            <div class="faceText" id="backText"></div>
            <div class="tapHint">Tryck för att vända tillbaka</div>
          </div>
        </div>
      </div>

      <div class="navRow">
        <button class="secondary" onclick="previousCard()">Föregående</button>
        <button onclick="nextCard()">Nästa kort</button>
      </div>

      <button class="secondary" onclick="openHome()">Till meny</button>
    </section>
  </div>

  <script>
    const categories = {
      landsdelar:{
        title:"Landsdelar",
        cards:[
          {
            q:"Vilka är Sveriges tre landsdelar?",
            a:"Sveriges tre landsdelar är Götaland, Svealand och Norrland."
          },
          {
            q:"Vad heter den landsdel som ligger i södra Sverige?",
            a:"Den landsdel som ligger i södra Sverige heter Götaland."
          },
          {
            q:"Vad heter den landsdel som ligger i mellersta Sverige?",
            a:"Den landsdel som ligger i mellersta Sverige heter Svealand."
          },
          {
            q:"Vad heter den landsdel som ligger i norra Sverige?",
            a:"Den landsdel som ligger i norra Sverige heter Norrland."
          }
        ]
      },

      kartan:{
        title:"Kartan",
        cards:[
          {
            q:"Var ligger Kebnekaise ungefär?",
            a:"Kebnekaise ligger ungefär i norra Sverige, i fjällområdet i Lappland."
          },
          {
            q:"Var ligger Norge i relation till Sverige?",
            a:"Norge ligger väster om Sverige."
          },
          {
            q:"Var ligger Finland i relation till Sverige?",
            a:"Finland ligger öster eller nordost om Sverige."
          }
        ]
      },

      stader:{
        title:"Städer i Norrland",
        cards:[
          {
            q:"Nämn 9 städer i Norrland.",
            a:"Nio exempel på städer i Norrland är Kiruna, Luleå, Umeå, Sundsvall, Östersund, Skellefteå, Örnsköldsvik, Gävle och Boden."
          }
        ]
      },

      havSjoar:{
        title:"Hav och sjöar",
        cards:[
          {
            q:"Vilka hav och vatten omger Sverige?",
            a:"Sverige omges av Bottenviken, Bottenhavet, Östersjön, Öresund, Kattegatt och Skagerack."
          },
          {
            q:"Vilka är Sveriges fyra största sjöar?",
            a:"Sveriges fyra största sjöar är Vänern, Vättern, Mälaren och Hjälmaren."
          }
        ]
      },

      vatten:{
        title:"Vatten",
        cards:[
          {
            q:"Var i Sverige finns det mycket vatten?",
            a:"Det finns mycket vatten runt Sveriges kuster och i områden med många sjöar och älvar. Sverige har också grundvatten nere i marken."
          },
          {
            q:"Varför är vatten viktigt?",
            a:"Vatten är viktigt eftersom människor, djur och växter behöver det för att leva. Vi använder också vatten till mat, hygien, energi och natur."
          },
          {
            q:"Vad kan vatten användas till?",
            a:"Vatten kan användas till dricksvatten, vattenkraft, fiske och annat som människor, djur, växter och natur behöver."
          },
          {
            q:"Vilka olika typer av vatten ska du kunna?",
            a:"Du ska kunna saltvatten, sötvatten och grundvatten."
          },
          {
            q:"Vad är saltvatten?",
            a:"Saltvatten är vatten med salt i. Det finns i haven runt Sverige."
          },
          {
            q:"Vad är sötvatten?",
            a:"Sötvatten är vatten med lite eller inget salt. Det finns till exempel i sjöar och älvar."
          },
          {
            q:"Vad är grundvatten?",
            a:"Grundvatten är vatten som finns nere i marken."
          },
          {
            q:"Vad betyder hållbart vattenbruk?",
            a:"Hållbart vattenbruk betyder att vi använder vatten och det som finns i vattnet utan att förstöra för naturen, människor eller framtiden."
          },
          {
            q:"Vad är överfiske?",
            a:"Överfiske betyder att man fiskar för mycket, så att fiskarna riskerar att minska kraftigt eller försvinna från ett område."
          },
          {
            q:"Vad är vattenkraft?",
            a:"Vattenkraft är energi eller el som skapas med hjälp av rinnande vatten."
          }
        ]
      },

      berg:{
        title:"Berg",
        cards:[
          {
            q:"Var i Sverige finns det mycket berg?",
            a:"Det finns mycket berg i fjällen och i norra Sverige."
          },
          {
            q:"Varför finns det mycket berg där?",
            a:"I norra Sverige finns fjäll och stora bergsområden. Därför är berg en viktig del av landskapet där."
          },
          {
            q:"Varför är berg viktigt?",
            a:"Berg är viktigt eftersom vi kan få resurser från berg, till exempel malm. Berg och fjäll är också viktiga delar av Sveriges natur."
          },
          {
            q:"Vad kan vi få från berg?",
            a:"Från berg kan vi få malm. Malm kan innehålla metaller som människor kan använda."
          },
          {
            q:"Vad är fjäll?",
            a:"Fjäll är bergsområden, framför allt i norra Sverige."
          },
          {
            q:"Vad är malm?",
            a:"Malm är berg eller sten som innehåller metall."
          },
          {
            q:"Vad är gruvdrift?",
            a:"Gruvdrift är när människor bryter malm eller andra ämnen ur berg och mark."
          },
          {
            q:"Vad betyder hållbart bergsbruk?",
            a:"Hållbart bergsbruk betyder att vi använder berg och resurser från berg på ett sätt som tar hänsyn till natur, människor och framtiden."
          }
        ]
      },

      befolkning:{
        title:"Befolkning",
        cards:[
          {
            q:"Hur många människor bor ungefär i Sverige?",
            a:"Det bor ungefär 10 miljoner människor i Sverige."
          },
          {
            q:"Var i Sverige finns det flest människor?",
            a:"Det finns flest människor i södra Sverige och i större tätorter."
          },
          {
            q:"Varför finns det flest människor just där?",
            a:"Där finns ofta fler jobb, skolor, vägar, vård, affärer och annan service. Därför bor många människor där."
          },
          {
            q:"Vad betyder det att Sveriges befolkning lever allt längre?",
            a:"Det betyder att människor i Sverige i genomsnitt blir äldre än tidigare."
          },
          {
            q:"Vilka konsekvenser kan det få att människor lever längre?",
            a:"När människor lever längre blir det fler äldre i samhället. Då behövs mer vård, omsorg och pengar till pensioner."
          },
          {
            q:"Hur kan ålder påverka Sveriges befolkning?",
            a:"Om det finns många äldre påverkar det samhället. Fler kan behöva hjälp och vård, medan färre kanske arbetar."
          },
          {
            q:"Vad behöver man kunna resonera om kring Sveriges befolkning?",
            a:"Man ska kunna resonera om hur många som bor i Sverige, var flest människor bor, varför de bor där och vad som händer när vi lever längre."
          }
        ]
      },

      begrepp:{
        title:"Begrepp",
        cards:[
          {
            q:"Vad betyder energi?",
            a:"Energi är kraft som kan användas, till exempel till el, värme eller rörelse."
          },
          {
            q:"Vad betyder dricksvatten?",
            a:"Dricksvatten är vatten som är rent nog för människor att dricka."
          },
          {
            q:"Vad betyder gruvdrift?",
            a:"Gruvdrift är när människor bryter malm eller andra ämnen ur berg och mark."
          },
          {
            q:"Vad betyder överfiske?",
            a:"Överfiske betyder att man fiskar för mycket, så att fiskarna riskerar att minska kraftigt eller försvinna."
          },
          {
            q:"Vad betyder saltvatten?",
            a:"Saltvatten är vatten med salt i. Det finns i hav."
          },
          {
            q:"Vad betyder sötvatten?",
            a:"Sötvatten är vatten med lite eller inget salt. Det finns i sjöar och älvar."
          },
          {
            q:"Vad betyder vattenkraft?",
            a:"Vattenkraft är energi eller el som skapas med hjälp av rinnande vatten."
          },
          {
            q:"Vad betyder grundvatten?",
            a:"Grundvatten är vatten som finns nere i marken."
          },
          {
            q:"Vad betyder fjäll?",
            a:"Fjäll är bergsområden, framför allt i norra Sverige."
          },
          {
            q:"Vad betyder malm?",
            a:"Malm är berg eller sten som innehåller metall."
          },
          {
            q:"Vad betyder befolkning?",
            a:"Befolkning är människorna som bor i ett land eller område."
          },
          {
            q:"Vad betyder befolkningstäthet?",
            a:"Befolkningstäthet betyder hur tätt människor bor på en viss yta."
          },
          {
            q:"Vad betyder landsbygd?",
            a:"Landsbygd är områden utanför städer och större tätorter."
          },
          {
            q:"Vad betyder tätort?",
            a:"Tätort är en plats där många hus och människor finns samlade."
          },
          {
            q:"Vad betyder urbanisering?",
            a:"Urbanisering betyder att fler människor flyttar till städer och tätorter."
          },
          {
            q:"Vad betyder flyktingar?",
            a:"Flyktingar är människor som tvingas lämna sitt hem eller land, till exempel på grund av krig eller fara."
          }
        ]
      }
    };

    let activeCards = [];
    let activeTitle = "";
    let currentIndex = 0;

    function openHome(){
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('home').classList.add('active');
      document.getElementById('headerInfo').textContent = 'Start';
    }

    function startCategory(key){
      if(key === 'alla'){
        activeCards = [];

        Object.keys(categories).forEach(categoryKey => {
          categories[categoryKey].cards.forEach(card => {
            activeCards.push({
              q:card.q,
              a:card.a,
              category:categories[categoryKey].title
            });
          });
        });

        activeTitle = "Alla kort";
      }else{
        activeCards = categories[key].cards.map(card => {
          return {
            q:card.q,
            a:card.a,
            category:categories[key].title
          };
        });

        activeTitle = categories[key].title;
      }

      currentIndex = 0;

      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('cards').classList.add('active');
      document.getElementById('headerInfo').textContent = activeTitle;
      document.getElementById('categoryTitle').textContent = activeTitle;

      renderCard();
    }

    function renderCard(){
      const card = activeCards[currentIndex];
      const progress = Math.round(((currentIndex + 1) / activeCards.length) * 100);

      document.getElementById('frontText').textContent = card.q;
      document.getElementById('backText').textContent = card.a;
      document.getElementById('frontCategory').textContent = card.category;
      document.getElementById('backCategory').textContent = card.category;
      document.getElementById('counter').textContent = (currentIndex + 1) + ' av ' + activeCards.length;
      document.getElementById('progress').style.width = progress + '%';
      document.getElementById('flashCard').classList.remove('flipped');
    }

    function flipCard(){
      document.getElementById('flashCard').classList.toggle('flipped');
    }

    function nextCard(){
      currentIndex = (currentIndex + 1) % activeCards.length;
      renderCard();
    }

    function previousCard(){
      currentIndex = (currentIndex - 1 + activeCards.length) % activeCards.length;
      renderCard();
    }
  </script>
</body>
</html>
